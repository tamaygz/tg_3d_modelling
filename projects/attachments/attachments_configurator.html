<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attachments Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: workbench — parameter rail on the left, 3D stage on the right, part tray + console under the stage */
:root {
  --bg: #eef0ee; --panel: #fbfcfb; --ink: #1d2422; --muted: #5d6965; --line: #d3d9d6;
  --accent: #a8741a; --accent-ink: #ffffff; --stage: #dfe4e1; --warn: #a3471b; --ok: #2f6b4a;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --display: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a19; --panel: #1d2422; --ink: #e4e9e7; --muted: #94a19c; --line: #2f3936;
  --accent: #e0a940; --accent-ink: #1a1408; --stage: #232b29; --warn: #f08a5d; --ok: #6cc196; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a19; --panel: #1d2422; --ink: #e4e9e7; --muted: #94a19c; --line: #2f3936;
  --accent: #e0a940; --accent-ink: #1a1408; --stage: #232b29; --warn: #f08a5d; --ok: #6cc196; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans) }
.wrap { padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 16px; max-width: 1600px; margin: 0 auto }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px }
h1 { font: 600 22px/1.2 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance }
.sub { color: var(--muted) }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px }
aside { display: flex; flex-direction: column; min-width: 0 }
.actions { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; border-radius: 6px 6px 0 0 }
button { font: 500 13px var(--sans); border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 7px 12px; border-radius: 4px; cursor: pointer }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
button:disabled { opacity: .5; cursor: default }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
form { padding: 4px 12px 12px; overflow: auto }
fieldset { border: 0; padding: 0; margin: 12px 0 0 }
legend { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line) }
.row label { font: 500 13px var(--mono); overflow-wrap: anywhere }
.row .help { grid-column: 1 / -1; color: var(--muted); font-size: 12px }
.row.wide { grid-template-columns: minmax(0, 1fr) }
.row.changed label::after { content: " •"; color: var(--accent) }
input[type=text], input[type=number], select { width: 100%; font: 13px var(--mono); padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums }
input.bad { border-color: var(--warn) }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); justify-self: start }
main { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.stage { position: relative; height: min(62vh, 640px); min-height: 320px; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.stage canvas { display: block; width: 100%; height: 100% }
.hud { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; pointer-events: none }
.hud > * { pointer-events: auto }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: 12px var(--mono); font-variant-numeric: tabular-nums }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.tools label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center }
.status { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 20px) }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px }
.tray h2, .console h2 { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px }
.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13px }
td { padding: 6px 12px; border-top: 1px solid var(--line); white-space: nowrap }
td.num { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted) }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; border: 1px solid rgba(0,0,0,.25) }
.pill { font: 11px var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted) }
.pill.ok { color: var(--ok); border-color: currentColor } .pill.err { color: var(--warn); border-color: currentColor }
td button { padding: 3px 8px; font-size: 12px }
pre { margin: 0; padding: 10px 12px; font: 12px/1.5 var(--mono); max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted) }
pre .e { color: var(--warn) }
.note { color: var(--muted); font-size: 12px; padding: 8px 12px; border-top: 1px solid var(--line) }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr) } .grid2 { grid-template-columns: minmax(0, 1fr) } aside form { max-height: none } }
@media (min-width: 901px) { aside { max-height: calc(100vh - 90px); position: sticky; top: 12px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="wrap">
  <header><h1 id="title"></h1><span class="sub" id="subtitle"></span></header>
  <aside class="panel">
    <div class="actions">
      <button class="primary" id="gen" type="button">Generate</button>
      <button id="reset" type="button">Reset to defaults</button>
      <button id="dlscad" type="button">Download .scad</button>
    </div>
    <form id="form" autocomplete="off"></form>
  </aside>
  <main>
    <div class="stage" id="stage">
      <div class="hud">
        <span class="chip" id="dims">—</span>
        <div class="tools">
          <label for="explode">Pull apart <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
          <button id="fit" type="button" class="chip">Reset view</button>
        </div>
      </div>
      <span class="chip status" id="status">Loading OpenSCAD…</span>
    </div>
    <div class="grid2">
      <section class="panel tray">
        <h2>Parts <button id="dlall" type="button">Download all STLs</button></h2>
        <div class="tbl"><table><tbody id="parts"></tbody></table></div>
        <div class="note">STLs are exported in their assembled position. Turn them flat on the bed in your slicer, or use the repo's print files.</div>
      </section>
      <section class="panel console">
        <h2>OpenSCAD messages</h2>
        <pre id="log">Nothing yet.</pre>
      </section>
    </div>
  </main>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

const MODEL = {"name": "attachments", "main": "projects/attachments/attachments.scad", "title": "Attachment plates: test coupon + one plate + lock key", "files": {"projects/attachments/attachments.scad": {"text": "// Attachment plates: test coupon + one plate + lock key\n// Print the coupon and a plate first to check the snap fit, then use the same plate on any project.\ninclude <../../lib/core.scad>\nuse <../../lib/attach.scad>\n\npart = \"all\";                    // which part to export (\"all\" = assembly)\n\n/* [Plate] */\n// what the plate mounts to\nattach_type = \"wall\"; // [wall, keyhole, skadis, hook, magnet, stand, flat, roof]\n// plate size: S 30x30, M 45x40, L 60x50 mm\nattach_size = \"M\"; // [S, M, L]\n\n/* [Options] */\n// wall: screw hole diameter\nscrew_d = 4.5;\n// wall: countersunk head diameter\nhead_d = 8.5;\n// magnet: [diameter, height] of the round magnets\nmagnet = [10, 3];\n// hook: thickness of the rod, rail or door it hangs on\nhook_gap = 6;\n// stand: plate centre to the host's bottom edge\nstand_reach = 40;\n// stand: lean back from vertical (degrees)\nstand_angle = 15; // [5:1:30]\n// stand: foot distance behind the host\nstand_depth = 40;\n// roof: plate centre up to the ceiling\nroof_reach = 60;\n// roof: angle between the host and the ceiling (90 = hangs straight down)\nroof_angle = 90; // [45:5:135]\n// roof: ceiling flange depth\nroof_depth = 40;\n\n/* [Hidden] */\n// probe for checks: 0 = off; 1 = half way in (arms must bend ~0.6 mm); 2 = seated (must be clear); 3 = seated, pulled back 0.4 mm (bumps must catch)\nprobe = 0;\nD  = attach_dims(attach_size);\ncw = attach_socket_w(attach_size) + 12;          // coupon width\ncl = attach_socket_len(attach_size) + 12;        // coupon length\nct = attach_depth() + 3;                         // coupon thickness\ncy = -3/2;                                       // coupon centre y (the socket has a pry notch below)\n\nparts = [\n  [\"coupon\", \"Test coupon\",  \"PLA\", [0,0,25],  COL_WOOD, \"print=x180\"],\n  [\"plate\",  \"Attachment plate\", \"PLA\", [0,0,-25], COL_FIXTURE, (attach_type == \"skadis\" || attach_type == \"hook\" || attach_type == \"roof\") ? \"print=auto\" : \"print=x180\"],\n];\nchecks = [ [\"plate\",\"coupon\",\"clear\"] ];\nreport = [ [\"plate w\", D[0]], [\"plate l\", D[1]], [\"socket length\", attach_socket_len(attach_size)] ];\n\nmodule plate() {\n  attach_plate(attach_type, attach_size, screw_d=screw_d, head_d=head_d, magnet=magnet, hook_gap=hook_gap,\n               stand_reach=stand_reach, stand_angle=stand_angle, stand_depth=stand_depth,\n               roof_reach=roof_reach, roof_angle=roof_angle, roof_depth=roof_depth);\n}\nmodule coupon() { difference() { translate([-cw/2, cy - cl/2, 0]) cube([cw, cl, ct]); attach_socket(attach_size); } }\n\nif (probe == 0) {\n  pick(\"coupon\") coupon();\n  pick(\"plate\") plate();\n} else {\n  intersection() { coupon(); translate([0, 0, probe == 1 ? -2.3 : probe == 3 ? -0.4 : 0]) attach_core(attach_size); }\n}\n"}, "lib/attach.scad": {"text": "// Universal attachment plates: one socket in a host's back, many interchangeable plates.\n// Use:  use <../../lib/attach.scad>\n//\n// How it works: push the plate straight into the socket and it snaps in. Each end of the plate (top and\n// bottom) has two flexible arms with a bump on a 45\u00b0 lead-in. The bumps bend the arms inward through the\n// socket mouth and click into grooves in the socket's end walls. The plate's solid corners carry the load,\n// not the arms, so hanging or standing cannot unsnap it. To remove it, lever it out with a flat\n// screwdriver in the notch below the plate.\n//\n// Conventions (host frame): the host's back face is z=0 and its body is z>0. The plate is drawn seated,\n// centred on the origin; it fills z=0..ATTACH_T and its features point to -z (the wall). +Y is up when the\n// host hangs. The socket reaches from y=-l/2-ATTACH_NOTCH (pry notch) to y=+l/2.\n\nATTACH_TYPES = [\"none\", \"wall\", \"keyhole\", \"skadis\", \"hook\", \"magnet\", \"stand\", \"flat\", \"roof\"];\nATTACH_SIZES = [\"S\", \"M\", \"L\"];\nATTACH_T     = 4.5;   // socket depth = plate core thickness\nATTACH_CLR   = 0.2;   // plate-to-socket clearance per face\nATTACH_NOTCH = 3;     // pry notch below the plate\nSNAP_LIP     = 1.5;   // socket mouth wall above the groove\nSNAP_B       = 0.8;   // bump height (arm deflection on the way in = SNAP_B - ATTACH_CLR)\nSNAP_ARM     = 1.2;   // arm thickness\nSNAP_GAP     = 1.0;   // slot behind each arm\nSNAP_CORNER  = 4;     // solid corners at each end of the arms (they carry the load)\nSNAP_BUMP    = 6;     // bump length along each arm, at its free tip\n\nfunction attach_dims(size) = size == \"S\" ? [30, 30] : size == \"L\" ? [60, 50] : [45, 40];   // [w (x), l (y)]\nfunction attach_socket_len(size) = attach_dims(size)[1] + ATTACH_NOTCH;                   // socket length (y)\nfunction attach_socket_w(size) = attach_dims(size)[0];                                     // socket width (x)\nfunction attach_depth() = ATTACH_T;\nfunction attach_strip() = ATTACH_CLR + SNAP_ARM + SNAP_GAP;    // end strips taken by the snap arms (keep features out)\n// bump profile, (y outward, z): retention ramp, flat top, 45\u00b0 lead-in towards +z (the way in)\nfunction snap_z0() = SNAP_LIP + 0.05 + 0.35*SNAP_B;   // ramp foot just inside the groove: no preload when seated\nfunction snap_z1() = snap_z0() + 0.35*SNAP_B + 0.4 + SNAP_B;\nfunction snap_groove() = [SNAP_LIP, snap_z1() + ATTACH_CLR];   // groove z range in the socket\n\n// ---------- host side ----------\n// cutter for the host: subtract it from the host body (back face z=0)\nmodule attach_socket(size=\"M\") {\n    w = attach_dims(size)[0]; l = attach_dims(size)[1]; g = snap_groove();\n    translate([-w/2, -l/2, -1]) cube([w, l, ATTACH_T + 1]);                                   // pocket\n    for (s=[-1,1]) translate([-w/2 + SNAP_CORNER - 0.5, s > 0 ? l/2 - 0.01 : -l/2 - SNAP_B - 0.01, g[0]])\n        cube([w - 2*SNAP_CORNER + 1, SNAP_B + 0.02, g[1] - g[0]]);                            // snap grooves\n    translate([-4, -l/2 - ATTACH_NOTCH, -1]) cube([8, ATTACH_NOTCH + 0.01, 2 + 1]);         // pry notch\n}\n\n// ---------- plates ----------\n// the interface every plate shares: core with snap arms, seated position\nmodule attach_core(size=\"M\") {\n    w = attach_dims(size)[0]; l = attach_dims(size)[1]; c = ATTACH_CLR;\n    ya = l/2 - c;                                    // arm outer face\n    xa = w/2 - SNAP_CORNER;                          // arms reach from the corners (x=\u00b1xa) to the centre\n    difference() {\n        translate([-w/2 + c, -l/2 + c, 0]) cube([w - 2*c, l - 2*c, ATTACH_T - c]);\n        for (s=[-1,1]) mirror([0, s > 0 ? 0 : 1, 0]) {\n            translate([-xa, ya - SNAP_ARM - SNAP_GAP, -1]) cube([2*xa, SNAP_GAP, ATTACH_T + 2]);   // slot behind the arms\n            translate([-SNAP_GAP/2, ya - SNAP_ARM - SNAP_GAP, -1]) cube([SNAP_GAP, SNAP_ARM + SNAP_GAP + 1, ATTACH_T + 2]);  // split at the tips\n        }\n    }\n    for (s=[-1,1], sx=[-1,1]) mirror([0, s > 0 ? 0 : 1, 0]) mirror([sx > 0 ? 0 : 1, 0, 0])\n        translate([SNAP_GAP/2 + 0.3, ya - 0.01, 0]) rotate([90,0,90]) linear_extrude(min(SNAP_BUMP, xa - SNAP_GAP/2 - 2))\n            polygon([[0, snap_z0() - 0.35*SNAP_B], [SNAP_B, snap_z0()], [SNAP_B, snap_z1() - SNAP_B], [0, snap_z1()]]);\n}\n\n// type: see ATTACH_TYPES.  Options:\n//   screw_d / head_d   wall: wood-screw clearance hole and countersunk head (90\u00b0)\n//   magnet = [d, h]     magnet: round magnets glued into pockets from the wall side\n//   hook_gap           hook: thickness of the rod, rail, wire or door the hook goes over\n//   stand_reach        stand: distance from the plate centre down to the host's bottom edge (+ = below)\n//   stand_angle        stand: how far the host leans back from vertical\n//   stand_depth        stand: how far behind the host the foot rests\n//   roof_reach         roof: plate centre up to the ceiling (must clear the host's top edge)\n//   roof_angle         roof: angle between the host and the ceiling (90 = hangs straight down)\n//   roof_depth         roof: ceiling flange depth (front to back)\nmodule attach_plate(type=\"wall\", size=\"M\", screw_d=4.5, head_d=8.5, magnet=[10, 3], magnet_clr=0.15,\n                    hook_gap=6, stand_reach=40, stand_angle=15, stand_depth=40, skadis_t=5,\n                    roof_reach=60, roof_angle=90, roof_depth=40) {\n    w = attach_dims(size)[0]; l = attach_dims(size)[1]; c = ATTACH_CLR;\n    difference() {\n        union() {\n            attach_core(size);\n            if (type == \"skadis\") for (x=skadis_x(w)) translate([x, 0, 0]) skadis_hook(skadis_t);\n            if (type == \"hook\") translate([0, l/2 - attach_strip(), 0]) rail_hook(w - 2*c, hook_gap);\n            if (type == \"stand\") for (s=[-1,1]) translate([s*(w/2 - c - 1.6), 0, 0])        // in the solid corners\n                stand_fin(l - 2*c, stand_reach, stand_angle, stand_depth);\n            if (type == \"roof\") roof_bracket(w - 2*c, l, roof_reach, roof_angle, roof_depth, screw_d, head_d);\n        }\n        if (type == \"wall\") for (y=[-l/4, l/4]) translate([0, y, 0]) {\n            translate([0,0,-1]) cylinder(d=screw_d, h=ATTACH_T + 2, $fn=32);\n            translate([0,0,ATTACH_T - c - (head_d - screw_d)/2]) cylinder(d1=screw_d, d2=head_d + 0.4, h=(head_d - screw_d)/2 + 0.2 + 0.01, $fn=48);\n            translate([0,0,ATTACH_T - c - 0.01]) cylinder(d=head_d + 0.4, h=1, $fn=48);\n        }\n        if (type == \"keyhole\") translate([0, -min(8, l/4), 0])\n            keyhole_cut(head_d=9, neck_d=4.5, travel=min(10, l/2 - 4), neck_t=2, depth=ATTACH_T - c - 0.6);\n        if (type == \"magnet\") for (p=magnet_xy(w, l, magnet[0])) translate([p[0], p[1], -1])\n            cylinder(d=magnet[0] + 2*magnet_clr, h=magnet[1] + 1, $fn=48);\n        if (type == \"flat\") for (i=[-3:3]) {\n            translate([i*w/7 - 0.4, -l/2, -1]) cube([0.8, l, 1.5]);\n            translate([-w/2, i*l/7 - 0.4, -1]) cube([w, 0.8, 1.5]);\n        }\n    }\n}\n\n// ---------- host helpers (use these in a project instead of placing sockets by hand) ----------\n// per-type options as one list, so hosts can pass them on: build it with attach_opts(...)\nfunction attach_opts(screw_d=4.5, head_d=8.5, magnet=[10, 3], hook_gap=6, stand_angle=15, stand_depth=40,\n                     roof_gap=10, roof_angle=90, roof_depth=40) =\n    [screw_d, head_d, magnet, hook_gap, stand_angle, stand_depth, roof_gap, roof_angle, roof_depth];\n// x positions for `count` sockets spread over 60% of `span` around `centre`. Sk\u00e5dis plates stay on the 40 mm grid.\n// avoid = [x, half width]: shift the whole row so no socket centre lies within that zone (dowels, screws ...).\nfunction attach_xs(count, span, type=\"wall\", centre=0, avoid=undef) = let(\n    sp0 = count > 1 ? 0.6*span/(count - 1) : 0,\n    sp  = type == \"skadis\" ? max(40, round(sp0/40)*40) : sp0,\n    x0  = [for (i=[0:1:count-1]) centre + (i - (count - 1)/2)*sp],\n    sh  = is_undef(avoid) ? [] : [for (x=x0) if (abs(x - avoid[0]) < avoid[1]) (x >= avoid[0] ? 1 : -1)*(avoid[1] - abs(x - avoid[0]))])\n    [for (x=x0) x + (len(sh) > 0 ? sh[0] : 0)];\n// plate centre y that centres socket + pry notch on a host whose middle is y_mid\nfunction attach_y(y_mid) = y_mid + ATTACH_NOTCH/2;\n// does a socket of this size fit a host `height` tall?  (use in an assert with attach_fit_msg)\nfunction attach_fits(size, height, margin=3) = attach_socket_len(size) <= height - margin;\nfunction attach_fit_msg(size, height) = str(\"attach_size \", size, \" needs \", attach_socket_len(size), \" mm of height; this host has \", height, \" mm. Choose a smaller size.\");\n// row for the project's `parts` table\nfunction attach_print_tag(type) = (type == \"skadis\" || type == \"hook\" || type == \"roof\") ? \"print=auto\" : \"print=x180\";\nfunction attach_parts_row(type, count, pull=[0, 0, -50], colour=\"#4d6170\") =\n    [\"attach\", \"Attachment plate\", \"PLA\", pull, colour, str(\"pieces=\", count), attach_print_tag(type)];\n// cutter: all sockets of a host (subtract from the host; back face z=0)\nmodule attach_sockets(type, size, xs, y) { if (type != \"none\") for (x=xs) translate([x, y, 0]) attach_socket(size); }\n// all plates of a host, seated. y_bottom / y_top = the host's lowest / highest edge (for stand and roof plates)\nmodule attach_plates(type, size, xs, y, opts=undef, y_bottom=undef, y_top=undef) {\n    o = is_undef(opts) ? attach_opts() : opts;\n    if (type != \"none\") for (x=xs) translate([x, y, 0])\n        attach_plate(type, size, screw_d=o[0], head_d=o[1], magnet=o[2], hook_gap=o[3],\n                     stand_reach=is_undef(y_bottom) ? 40 : y - y_bottom, stand_angle=o[4], stand_depth=o[5],\n                     roof_reach=is_undef(y_top) ? 60 : y_top - y + o[6], roof_angle=o[7], roof_depth=o[8]);\n}\n\n// ---------- plate features ----------\n// ceiling bracket: a stem rises behind the host from the plate to a ceiling flange (4 countersunk screws, room\n// side). The stem joins only the plate's middle, with 0.6 mm clearance over the snap arms so they can flex.\n// The flange top (ceiling contact) is at y = reach; `angle` is between the host and the ceiling.\nmodule roof_bracket(w, l, reach=60, angle=90, depth=40, screw_d=4.5, head_d=8.5, st=5, ft=5, tab=10) {\n    sp = attach_strip();\n    jz = -0.6 - st/2;                                            // stem centre line (z)\n    module at_joint() { translate([0, reach, jz]) rotate([90 - angle, 0, 0]) children(); }   // flange frame\n    FW = w + 2*tab;\n    translate([-w/2, -l/2 + sp + 0.5, -0.61]) cube([w, l - 2*sp - 1, 0.62]);                // pad onto the core\n    translate([-w/2, -l/2 + sp + 0.5, -0.6 - st]) cube([w, reach - ft + l/2 - sp - 0.5 + 0.01, st]);  // stem\n    difference() {\n        at_joint() translate([-FW/2, -ft, -depth/2]) cube([FW, ft, depth]);                  // flange\n   hull() { translate([-l/2, -0.01]) square([l, 0.02]); translate([fy, -depth]) circle(r=2.5, $fn=24); }\n}\n// keyhole cut from the wall side (z=0) into a plate\nmodule keyhole_cut(head_d=9, neck_d=4.5, travel=10, neck_t=2, depth=4) {\n    translate([0,0,-1]) cylinder(d=head_d, h=depth + 1, $fn=48);\n    translate([0,0,-1]) hull() { cylinder(d=neck_d, h=neck_t + 1, $fn=32); translate([0,travel,0]) cylinder(d=neck_d, h=neck_t + 1, $fn=32); }\n    translate([0,0,neck_t]) hull() { cylinder(d=head_d, h=depth - neck_t, $fn=48); translate([0,travel,0]) cylinder(d=head_d, h=depth - neck_t, $fn=48); }\n}\n"}, "lib/core.scad": {"text": "// Core atoms shared by every project and library file.\n// Projects:  include <../../lib/core.scad>   (include, not use: pick() reads the project's `part` variable and\n//            the palette below are variables).   Library files: use <core.scad> for the modules and functions.\n\n// ---------- project plumbing ----------\n// render children only for the selected part (\"all\" = whole assembly); every part of a project goes through this\nmodule pick(n) { if (part == \"all\" || part == n) children(); }\n\n// ---------- solids and transforms ----------\n// extrude 2D children between two heights\nmodule slab(z1, z2) { translate([0, 0, z1]) linear_extrude(z2 - z1) children(); }\n// apply a 2x3 affine matrix [[a, b, tx], [c, d, ty]] to 2D children (fitted glyph / artwork placement)\nmodule affine2d(m) { multmatrix([[m[0][0], m[0][1], 0, m[0][2]], [m[1][0], m[1][1], 0, m[1][2]], [0, 0, 1, 0], [0, 0, 0, 1]]) children(); }\n// children plus their mirror image across the y axis\nmodule mirror_pair() { children(); mirror([1, 0]) children(); }\n\n// countersunk screw hole through a wall of thickness t (z=0..t), head sunk into the top face. Defaults: M3\nmodule csk_hole(t, d=3.4, head_d=6.6, depth=1.55) {\n    translate([0, 0, -1]) cylinder(d=d, h=t + 2, $fn=24);\n    translate([0, 0, t - depth]) cylinder(d1=d, d2=head_d, h=depth + 0.01, $fn=32);\n}\ EY_DARK = \"#3d4a54\";\nCOL_FIXTURE   = \"#4d6170\";   // attachment plates\nCOL_CLEAR     = \"#e9eef0\";   // diffusers\n"}}, "params": [{"name": "attach_type", "raw": "\"wall\"", "type": "string", "comment": "what the plate mounts to", "section": "Plate", "options": ["wall", "keyhole", "skadis", "hook", "magnet", "stand", "flat", "roof"]}, {"name": "attach_size", "raw": "\"M\"", "type": "string", "comment": "plate size: S 30x30, M 45x40, L 60x50 mm", "section": "Plate", "options": ["S", "M", "L"]}, {"name": "screw_d", "raw": "4.5", "type": "number", "comment": "wall: screw hole diameter", "section": "Options"}, {"name": "head_d", "raw": "8.5", "type": "number", "comment": "wall: countersunk head diameter", "section": "Options"}, {"name": "magnet", "raw": "[10, 3]", "type": "expr", "comment": "magnet: [diameter, height] of the round magnets", "section": "Options"}, {"name": "hook_gap", "raw": "6", "type": "number", "comment": "hook: thickness of the rod, rail or door it hangs on", "section": "Options"}, {"name": "stand_reach", "raw": "40", "type": "number", "comment": "stand: plate centre to the host's bottom edge", "section": "Options"}, {"name": "stand_angle", "raw": "15", "type": "number", "comment": "stand: lean back from vertical (degrees)", "section": "Options", "range": [5.0, 1.0, 30.0]}, {"name": "stand_depth", "raw": "40", "type": "number", "comment": "stand: foot distance behind the host", "section": "Options"}, {"name": "roof_reach", "raw": "60", "type": "number", "comment": "roof: plate centre up to the ceiling", "section": "Options"}, {"name": "roof_angle", "raw": "90", "type": "number", "comment": "roof: angle between the host and the ceiling (90 = hangs straight down)", "section": "Options", "range": [45.0, 5.0, 135.0]}, {"name": "roof_depth", "raw": "40", "type": "number", "comment": "roof: ceiling flange depth", "section": "Options"}], "parts": [{"id": "coupon", "label": "Test coupon", "color": "#7a2e1c", "explode": [0.0, 0.0, 25.0]}, {"id": "plate // ---------- OpenSCAD runner (worker, main-thread fallback) ----------
const CORE = `
import { createOpenSCAD } from "${OPENSCAD_JS}";
export async function run(job) {
  const log = [];
  const o = await createOpenSCAD({ noInitialRun: true, print: s => log.push(s), printErr: s => log.push(s) });
  const m = o.getInstance(), FS = m.FS;
  const mk = p => { try { FS.mkdir(p) } catch (e) {} };
  mk("/fonts"); mk("/m");
  FS.writeFile("/fonts/fonts.conf", '<?xml version="1.0"?><fontconfig><dir>/fonts</dir></fontconfig>');
  for (const [name, data] of job.files) {
    const parts = name.split("/"); let d = "/m";
    for (const s of parts.slice(0, -1)) { d += "/" + s; mk(d) }
    FS.writeFile("/m/" + name, data);
    if (/\\.(ttf|otf)$/i.test(name)) FS.writeFile("/fonts/" + parts[parts.length - 1], data);
  }
  const args = ["/m/" + job.main, "-o", "/out.stl", "--backend=Manifold", "--export-format=binstl", "-D", 'part="' + job.part + '"'];
  for (const d of job.defs) args.push("-D", d);
  let rc = 0;
  try { rc = m.callMain(args) } catch (e) { rc = typeof e?.status === "number" ? e.status : 1; if (typeof e?.status !== "number") log.push("ERROR: " + e) }
  let stl = null; try { stl = FS.readFile("/out.stl") } catch (e) {}
  return { rc, log, stl };
}`;

const WORKER = `import { run } from "${coreUrl}";
self.onmessage = async (e) => { let r; try { r = await run(e.data) } catch (err) { r = { rc: 1, log: ["ERROR: " + err], stl: null } }
  self.postMessage({ ...r, id: e.data.id }, r.stl ? [r.stl.buffer] : []) };`;
const workerUrl = URL.createObjectURL(new Blob([WORKER], { type: "text/javascript" }));

let worker = null, useMain = false, mainRun = null, pending = new Map(), jobId = 0;
function startWorker() {
  try {
    worker = new Worker(workerUrl, { type: "module" });
    worker.onmessage = (e) => { const cb = pending.get(e.data.id); pending.delete(e.data.id); cb && cb(e.data) };
    worker.onerror = (e) => { e.preventDefault?.(); if (!useMain) { useMain = true; worker = null; for (const [id, cb] of pending) cb({ retry: true }); pending.clear() } };
  } catch (e) { useMain = true }

async function runJob(job) {
  if (!useMain) {
    if (!worker) startWorker();
    if (!useMain) {
      const r = await new Promise((res) => { const id = ++jobId; pending.set(id, res); worker.postMessage({ ...job, id }) });
      if (!r.retry) return r;
    }
  }
  if (!mainRun) mainRun = (await import(coreUrl)).run;
  return mainRun(job);
}

  const el = tr.querySelector(".pill"); el.textContent = pill; el.className = "pill " + (cls || "");
  tr.querySelector(".tri").textContent = tri || "";
  tr.querySelector("button").disabled = !state[id]?.stl;
}
function download(data, name, type) {
  if (!data) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$("dlall").onclick = async () => {
  for (const p of MODEL.parts) if (state[p.id]?.stl) { download(state[p.id].stl, `${MODEL.name}_${p.id}.stl`, "model/stl"); await new Promise(r => setTimeout(r, 350)) }
};
$("dlscad").onclick = () => {
  let src = MODEL.files[MODEL.main].text;
  for (const p of MODEL.params) {
    const re = new RegExp("^(\\s*" + p.name.replace(/\$/g, "\\$") + "\\s*=\\s*)(.+?)(;.*)$", "m");
    src = src.replace(re, (m, a, b, c) => a + rawValue(p) + c);
  }
  download(src, MODEL.main, "text/plain");
};

// ---------- generate ----------
let gen = 0;
async function generate() {
  const my = ++gen;
  if (worker && pending.size) { worker.terminate(); worker = null; pending.clear() }
  $("gen").disabled = true;
  const defs = MODEL.params.map(p => `${p.name}=${rawValue(p)}`);
  const logOut = [], seen = new Set();
  for (const p of MODEL.parts) setRow(p.id, "queued", "", "");
  const t0 = performance.now(); let done = 0, failed = 0, first = true;
  for (const p of MODEL.parts) {
    if (my !== gen) return;
    $("status").textContent = `Rendering ${p.label} (${done + 1}/${MODEL.parts.length})…`; $("status").hidden = false;
    setRow(p.id, "rendering", "", "");
    const t = performance.now();
    const r = await runJob({ files: FILES, main: MODEL.main, part: p.id, defs });
    if (my !== gen) return;
    done++;
    const msgs = r.log.filter(s => /WARNING|ERROR|ECHO|TRACE/.test(s) && !/localization/.test(s));
    const fresh = msgs.filter(s => !seen.has(s)); fresh.forEach(s => seen.add(s));   // same message from every part: show once
    if (fresh.length) logOut.push(`[${p.label}]`, ...fresh);
    if (meshes[p.id]) { group.remove(meshes[p.id]); meshes[p.id].geometry.dispose(); delete meshes[p.id] }
    state[p.id] = { stl: null };
    const empty = !r.stl || r.stl.length <= 84;
    if (empty) {
      const err = msgs.some(s => /ERROR/.test(s));
      if (err) failed++;
      setRow(p.id, err ? "error" : "not used", err ? "err" : "", "");
      continue;
    }
    state[p.id].stl = r.stl;
    const geo = loader.parse(r.stl.buffer.slice(r.stl.byteOffset, r.stl.byteOffset + r.stl.byteLength));
    const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.55, metalness: /#(c|d|e)[0-9a-f]/i.test(p.color) ? 0.35 : 0.05 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = $("vis_" + p.id).checked;
    meshes[p.id] = mesh; group.add(mesh); applyExplode();
    if (first) { fitView(); first = false }
    setRow(p.id, `${((performance.now() - t) / 1000).toFixed(1)} s`, "ok", (geo.attributes.position.count / 3).toLocaleString() + " tris");
    showDims();
  }
  fitView(); showDims();
  $("log").innerHTML = "";
  if (!logOut.length) $("log").textContent = "No warnings or errors.";
  for (const s of logOut) { const sp = document.createElement("span"); if (/ERROR/.test(s)) sp.className = "e"; sp.textContent = s + "\n"; $("log").appendChild(sp) }
  $("status").textContent = failed ? `${failed} part(s) failed. See OpenSCAD messages.` : `Done in ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  setTimeout(() => { if (my === gen && !failed) $("status").hidden = true }, 2500);
  $("gen").disabled = false;
}
$("gen").onclick = generate;
generate();
</script>
</body>
</html>
