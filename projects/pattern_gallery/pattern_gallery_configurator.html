<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Gallery Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: workbench — parameter rail on the left, 3D stage on the right, part tray + console under the stage */
:root {
  --bg: #eef0ee; --panel: #fbfcfb; --ink: #1d2422; --muted: #5d6965; --line: #d3d9d6;
  --accent: #a8741a; --accent-ink: #ffffff; --stage: #dfe4e1; --warn: #a3471b; --ok: #2f6b4a;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --display: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a19; --panel: #1d2422; --ink: #e4e9e7; --muted: #94a19c; --line: #2f3936;
  --accent: #e0a940; --accent-ink: #1a1408; --stage: #232b29; --warn: #f08a5d; --ok: #6cc196; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a19; --panel: #1d2422; --ink: #e4e9e7; --muted: #94a19c; --line: #2f3936;
  --accent: #e0a940; --accent-ink: #1a1408; --stage: #232b29; --warn: #f08a5d; --ok: #6cc196; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans) }
.wrap { padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 16px; max-width: 1600px; margin: 0 auto }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px }
h1 { font: 600 22px/1.2 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance }
.sub { color: var(--muted) }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px }
aside { display: flex; flex-direction: column; min-width: 0 }
.actions { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; border-radius: 6px 6px 0 0 }
button { font: 500 13px var(--sans); border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 7px 12px; border-radius: 4px; cursor: pointer }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
button:disabled { opacity: .5; cursor: default }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
form { padding: 4px 12px 12px; overflow: auto }
fieldset { border: 0; padding: 0; margin: 12px 0 0 }
legend { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line) }
.row label { font: 500 13px var(--mono); overflow-wrap: anywhere }
.row .help { grid-column: 1 / -1; color: var(--muted); font-size: 12px }
.row.wide { grid-template-columns: minmax(0, 1fr) }
.row.changed label::after { content: " •"; color: var(--accent) }
input[type=text], input[type=number], select { width: 100%; font: 13px var(--mono); padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums }
input.bad { border-color: var(--warn) }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); justify-self: start }
main { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.stage { position: relative; height: min(62vh, 640px); min-height: 320px; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.stage canvas { display: block; width: 100%; height: 100% }
.hud { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; pointer-events: none }
.hud > * { pointer-events: auto }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: 12px var(--mono); font-variant-numeric: tabular-nums }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.tools label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center }
.status { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 20px) }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px }
.tray h2, .console h2 { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px }
.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13px }
td { padding: 6px 12px; border-top: 1px solid var(--line); white-space: nowrap }
td.num { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted) }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; border: 1px solid rgba(0,0,0,.25) }
.pill { font: 11px var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted) }
.pill.ok { color: var(--ok); border-color: currentColor } .pill.err { color: var(--warn); border-color: currentColor }
td button { padding: 3px 8px; font-size: 12px }
pre { margin: 0; padding: 10px 12px; font: 12px/1.5 var(--mono); max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted) }
pre .e { color: var(--warn) }
.note { color: var(--muted); font-size: 12px; padding: 8px 12px; border-top: 1px solid var(--line) }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr) } .grid2 { grid-template-columns: minmax(0, 1fr) } aside form { max-height: none } }
@media (min-width: 901px) { aside { max-height: calc(100vh - 90px); position: sticky; top: 12px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="wrap">
  <header><h1 id="title"></h1><span class="sub" id="subtitle"></span></header>
  <aside class="panel">
    <div class="actions">
      <button class="primary" id="gen" type="button">Generate</button>
      <button id="reset" type="button">Reset to defaults</button>
      <button id="dlscad" type="button">Download .scad</button>
    </div>
    <form id="form" autocomplete="off"></form>
  </aside>
  <main>
    <div class="stage" id="stage">
      <div class="hud">
        <span class="chip" id="dims">—</span>
        <div class="tools">
          <label for="explode">Pull apart <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
          <button id="fit" type="button" class="chip">Reset view</button>
        </div>
      </div>
      <span class="chip status" id="status">Loading OpenSCAD…</span>
    </div>
    <div class="grid2">
      <section class="panel tray">
        <h2>Parts <button id="dlall" type="button">Download all STLs</button></h2>
        <div class="tbl"><table><tbody id="parts"></tbody></table></div>
        <div class="note">STLs are exported in their assembled position. Turn them flat on the bed in your slicer, or use the repo's print files.</div>
      </section>
      <section class="panel console">
        <h2>OpenSCAD messages</h2>
        <pre id="log">Nothing yet.</pre>
      </section>
    </div>
  </main>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

const MODEL = {"name": "pattern_gallery", "main": "projects/pattern_gallery/pattern_gallery.scad", "title": "Pattern gallery: catalogue and test bench for the 15 patterns in lib/patterns.scad", "files": {"projects/pattern_gallery/pattern_gallery.scad": {"text": "// Pattern gallery: catalogue and test bench for the 15 patterns in lib/patterns.scad\n// Views: a tile of every pattern, one sample you can tune, one pattern in every application mode, and a small\n// box whose walls, floor and lid each get their own pattern. See README.md.\ninclude <../../lib/core.scad>\nuse <../../lib/shapes.scad>\nuse <../../lib/patterns.scad>\n\npart = \"all\";                    // which part to export (\"all\" = assembly); set by the build tools\n\n/* [View] */\n// gallery = all 15 patterns, sample = one pattern in one mode, modes = one pattern in every mode, box = container demo\nview = \"gallery\"; // [gallery, sample, modes, box]\n\n/* [Pattern (sample and modes views)] */\n// which pattern\npattern = \"hex_honeycomb\"; // [hex_honeycomb, square_grid, diamond_lattice, triangular_lattice, cube_rosette, basket_weave, tri_weave, voronoi, fish_scales, truchet_arcs, girih_star_cross, asanoha, flowing_waves, concentric_ripples, fluted]\n// how it is applied to the sample (sample view)\nmode = \"open_lattice\"; // [solid, through_cut, open_lattice, raised, recessed, overlay]\n// repeat size in mm (0 = the pattern's default)\ncell = 0; // [0:0.5:60]\n// repeat size in Y for patterns with two sizes: square grid, diamond, fish scales (0 = default proportion)\ncell_y = 0; // [0:0.5:60]\n// rib / strip / line width in mm (0 = the pattern's default)\nstrut = 0; // [0:0.1:12]\n// rotation of the pattern (degrees)\nangle = 0; // [-180:5:180]\n// more, smaller cells (cell size divided by this; rib width stays)\ndensity = 1; // [0.5:0.1:3]\n// shift of the pattern (mm)\noffset_x = 0; // [-30:0.5:30]\noffset_y = 0; // [-30:0.5:30]\n// seed for Voronoi and Truchet (same seed = same pattern)\nseed = 1; // [1:1:999]\n// smallest printable rib and opening (the model stops with a message below these; 0 = no check)\nmin_strut = 0.8; // [0:0.1:3]\nmin_opening = 1; // [0:0.1:5]\n\n/* [Sample] */\n// sample size (mm)\nsample_w = 80; // [20:1:240]\nsample_h = 60; // [20:1:240]\n// outline of the sample\nsample_shape = \"rounded\"; // [rect, rounded, chamfered, notched, arched, wave, scalloped, round, hexagon]\n// panel thickness (open lattice of a woven pattern: total height of the weave)\nthickness = 2.4; // [0.6:0.2:10]\n// relief height (raised), engraving depth (recessed)\nrelief = 1; // [0.2:0.1:5]\n// solid frame around the pattern\nborder = 2.5; // [0:0.5:15]\n// extra plain margin inside the frame\npad = 0; // [0:0.5:15]\n// top of raised ribs\nrelief_profile = \"flat\"; // [flat, round]\n\n/* [Overlay / lining] */\n// lining thickness\nlining_t = 0.8; // [0.4:0.2:3]\n// how the pattern shows on the lining\nlining_mode = \"through_cut\"; // [through_cut, raised, recessed]\n// distance from the panel edge to the lining\nlining_inset = 1.5; // [0:0.5:10]\n// top edge of the lining\nlining_edge = \"square\"; // [square, chamfer]\n\n/* [Pattern details] */\n// honeycomb: corners or flats pointing up\nhex_orient = \"pointy\"; // [pointy, flat]\n// square grid: shift of every other row (0.5 = bricks)\ngrid_stagger = 0; // [0:0.05:0.5]\n// triangular lattice: open every triangle, or only every other one\ntri_alternate = true;\n// weaves: strand cross-section\nstrand_style = \"flat\"; // [flat, rounded]\n// weaves: how far a strand climbs over the one below, as a share of the strand thickness\nweave_lift = 0.6; // [0.2:0.05:0.85]\n// Voronoi: 0 = regular grid, 1 = fully irregular\nvoronoi_irregularity = 1; // [0:0.05:1]\n// Voronoi: corner radius of the cells\nvoronoi_round = 0; // [0:0.1:4]\n// Voronoi: fill cells smaller than this (mm)\nvoronoi_min_cell = 0; // [0:0.5:20]\n// fish scales: share of a scale hidden under the row above\nscale_overlap = 0.4; // [0:0.05:0.7]\n// fish scales: roundness of the tip\nscale_curvature = 0.7; // [0.2:0.05:1]\n// fish scales: shift of every other row\nscale_stagger = 0.5; // [0:0.05:0.5]\n// fish scales: raised as stepped shingles (off = raised outlines only)\nscale_shingle = true;\n// Truchet: how the tiles are turned\ntruchet_variation = \"random\"; // [random, alternate, rows, uniform]\n// Girih: star diameter as a share of the repeat (1 = stars touch)\ngirih_star = 1; // [0.6:0.05:1]\n// cube rosette: one hexagon in three a cube (sparse), two in three (dense), all (tumbling blocks) or none\ncube_density = \"sparse\"; // [sparse, dense, all, none]\n// fluted / reeded: convex half-round ribs (reeded), concave grooves (fluted) or flat ribs; ribs upright or lying\nflute_style = \"reeded\"; // [reeded, fluted, ribbed]\nflute_orient = \"vertical\"; // [vertical, horizontal]\n// asanoha: a family of grid lines lying (up) or standing (side)\nasanoha_orient = \"up\"; // [up, side]\n// waves: height of the wave and its length (mm)\nwave_amplitude = 3; // [0:0.5:20]\nwave_length = 30; // [8:1:120]\n// waves: phase shift from rib to rib (degrees)\nwave_shift = 0; // [0:5:180]\n// ripples: number of rings (0 = fill the surface)\nripple_rings = 0; // [0:1:30]\n// ripples: radial bars that tie the rings together (needed for cut-through and open lattice)\nripple_spokes = 0; // [0:1:16]\n// ripples: how much lower the outer rings are (0 = all the same)\nripple_falloff = 0.6; // [0:0.05:0.9]\n// ripples: second ripple centre (off = one centre)\nripple_two_centers = false;\n\n/* [Gallery] */\n// tile size (mm)\ntile = 56; // [30:2:120]\n// gap between tiles\ntile_gap = 6; // [2:1:20]\n\n/* [Box demo] */\n// inner pattern choices for the four walls, the floor and the lid\nwall_pattern = \"hex_honeycomb\"; // [hex_honeycomb, square_grid, diamond_lattice, triangular_lattice, cube_rosette, basket_weave, tri_weave, voronoi, fish_scales, truchet_arcs, girih_star_cross, asanoha, flowing_waves, concentric_ripples, fluted]\nwall_mode = \"through_cut\"; // [solid, through_cut, open_lattice, raised, recessed, overlay]\n// the front wall can differ from the other three\nfront_pattern = \"flowing_waves\"; // [same, hex_honeycomb, square_grid, diamond_lattice, triangular_lattice, cube_rosette, basket_weave, tri_weave, voronoi, fish_scales, truchet_arcs, girih_star_cross, asanoha, flowing_waves, concentric_ripples, fluted]\nfront_mode = \"raised\"; // [solid, through_cut, open_lattice, raised, recessed, overlay]\nfloor_pattern = \"concentric_ripples\"; // [hex_honeycomb, square_grid, diamond_lattice, triangular_lattice, cube_rosette, basket_weave, tri_weave, voronoi, fish_scales, truchet_arcs, girih_star_cross, asanoha, flowing_waves, concentric_ripples, fluted]\nfloor_mode = \"raised\"; // [solid, through_cut, open_lattice, raised, recessed, overlay]\nroof_pattern = \"girih_star_cross\"; // [hex_honeycomb, square_grid, diamond_lattice, triangular_lattice, cube_rosette, basket_weave, tri_weave, voronoi, fish_scales, truchet_arcs, girih_star_cross, asanoha, flowing_waves, concentric_ripples, fluted]\nroof_mode = \"through_cut\"; // [solid, through_cut, open_lattice, raised, recessed, overlay]\n// outer size of the box (mm)\nbox_w = 70; // [40:1:200]\nbox_d = 50; // [40:1:200]\nbox_h = 36; // [20:1:150]\n// thicknesses\nwall_t = 2.4; // [1.2:0.2:6]\nfloor_t = 2; // [1:0.2:6]\nroof_t = 2; // [1:0.2:6]\n// pattern size on the box surfaces, relative to each pattern's default\nbox_pattern_scale = 0.7; // [0.4:0.05:1.5]\n// relief height / engraving depth on the box\nbox_relief = 0.6; // [0.2:0.1:2]\n\n/* [Hidden] */\n$fn = 48;\nNAMES = [\"hex_honeycomb\", \"square_grid\", \"diamond_lattice\", \"triangular_lattice\", \"cube_rosette\",\n         \"basket_weave\", \"tri_weave\", \"voronoi\", \"fish_scales\", \"truchet_arcs\",\n         \"girih_star_cross\", \"asanoha\", \"flowing_waves\", \"concentric_ripples\", \"fluted\"];\nLABELS = [\"Hex honeycomb\", \"Square grid\", \"Diamond lattice\", \"Triangular lattice\", \"Cube rosette\",\n          \"Basket weave\", \"Tri-weave\", \"Voronoi\", \"Fish scales\", \"Truchet arcs\",\n          \"Girih star & cross\", \"Asanoha\", \"Flowing waves\", \"Concentric ripples\", \"Fluted\"];\n// how each pattern is shown in the gallery: its natural use\nGALLERY_MODES = [\"open_lattice\", \"open_lattice\", \"open_lattice\", \"open_lattice\", \"open_lattice\",\n                 \"open_lattice\", \"open_lattice\", \"open_lattice\", \"raised\", \"recessed\",\n                 \"overlay\", \"open_lattice\", \"raised\", \"raised\", \"raised\"];\nMODES = [\"through_cut\", \"open_lattice\", \"raised\", \"recessed\", \"overlay\"];\n\n// pattern-specific settings from the Customizer, as the opts list of a spec\nfunction opts_for(name, h) =\n    name == \"hex_honeycomb\" ? [[\"orient\", hex_orient]] :\n    name == \"square_grid\" ? [[\"stagger\", grid_stagger]] :\n    name == \"triangular_lattice\" ? [[\"alternate\", tri_alternate]] :\n    name == \"basket_weave\" || name == \"tri_weave\" ? [[\"style\", strand_style], [\"lift\", h*weave_lift/(1 + weave_lift)]] :\n    name == \"voronoi\" ? [[\"irregularity\", voronoi_irregularity], [\"round\", voronoi_round], [\"min_cell\", voronoi_min_cell]] :\n    name == \"fish_scales\" ? [[\"overlap\", scale_overlap], [\"curvature\", scale_curvature], [\"stagger\", scale_stagger], [\"shingle\", scale_shingle]] :\n    name == \"truchet_arcs\" ? [[\"variation\", truchet_variation]] :\n    name == \"girih_star_cross\" ? [] :\n    name == \"cube_rosette\" ? [[\"cubes\", cube_density]] :\n    name == \"asanoha\" ? [[\"orient\", asanoha_orient]] :\n    name == \"fluted\" ? [[\"style\", flute_style], [\"orient\", flute_orient]] :\n    name == \"flowing_waves\" ? [[\"amplitude\", wave_amplitude], [\"wavelength\", wave_length], [\"shift\", wave_shift]] :\n    [[\"rings\", ripple_rings], [\"spokes\", ripple_spokes], [\"falloff\", ripple_falloff],\n     [\"centers\", ripple_two_centers ? [[-sample_w/6, -sample_h/8], [sample_w/5, sample_h/6]] : [[0, 0]]]];\nfunction scaled(v, k) = is_list(v) ? [for (x=v) x*k] : v*k;\n// the user's cell: 0 = default; one number scales the default proportion; cell_y sets the second size\nfunction user_cell(name) = let(d = pattern_default(name)[0])\n    cell == 0 ? d : cell_y > 0 ? [cell, cell_y] : is_list(d) ? scaled(d, cell/d[0]) : cell;\n// height of the strands in the chosen mode (the weave's lift is a share of it)\nfunction weave_h(m) = m == \"open_lattice\" ? thickness : relief;\nfunction girih_opts(name, c) = name == \"girih_star_cross\" && girih_star < 1 ? [[\"star\", (is_list(c) ? c[0] : c)/density*girih_star]] : [];\nfunction user_spec(m) = let(c = user_cell(pattern))\n    pattern_spec(pattern, c, strut == 0 ? undef : strut, angle, [offset_x, offset_y], density, seed,\n                 opts=concat(opts_for(pattern, weave_h(m)), girih_opts(pattern, c)), min_strut=min_strut, min_opening=min_opening);\n// library defaults, scaled, for the box surfaces\nfunction box_spec(name, h) = pattern_sized(name, box_pattern_scale, strut_min=0.8,\n    opts=name == \"concentric_ripples\" ? [[\"spokes\", 6], [\"falloff\", 0.5]] : []);\n\nfront = front_pattern == \"same\" ? wall_pattern : front_pattern;\nfront_m = front_pattern == \"same\" ? wall_mode : front_mode;\ntp = tile + tile_gap;                                 // tile pitch\nmp = sample_w + 8;                                    // pitch of the mode samples\npost = 6;                                             // corner posts of the box (carry the lid pins)\npin_d = 3; pin_h = 2; pin_clr = 0.2;                  // lid pins on the posts\nfunction tile_pos(i) = [(i%5 - 2)*tp, (1 - floor(i/5))*tp];      // 5 columns, 3 rows\n\nfeat = pattern_features(user_spec(mode));\nparts = concat(\n  [for (i=[0:len(NAMES)-1]) [str(\"g_\", NAMES[i]), LABELS[i], \"PLA\", [0,0,0], i < 5 ? COL_GREY : i < 7 ? COL_TAN : i == 7 ? COL_FIXTURE : i < 12 ? COL_BRASS : COL_GREY_DARK]],\n  [[\"sample\", \"Sample\", \"PLA\", [0,0,0], COL_GOLD],\n   [\"m_flat\", \"Pattern alone\", \"PLA\", [0,0,0], COL_GREY],\n   [\"m_through_cut\", \"Through-cut\", \"PLA\", [0,0,0], COL_GREY],\n   [\"m_open_lattice\", \"Open lattice\", \"PLA\", [0,0,0], COL_TAN],\n   [\"m_raised\", \"Raised\", \"PLA\", [0,0,0], COL_BRASS],\n   [\"m_recessed\", \"Recessed\", \"PLA\", [0,0,0], COL_FIXTURE],\n   [\"m_overlay\", \"Overlay\", \"PLA\", [0,0,0], COL_GREY_DARK],\n   [\"box\", \"Box\", \"PLA\", [0,0,0], COL_GREY],\n   [\"lid\", \"Lid\", \"PLA\", [0,0,25], COL_BRASS]]);\nchecks = view == \"box\" ? [[\"lid\", \"box\", \">=\", 0]] : [];\nreport = [[\"pattern rib width\", feat[0]], [\"smallest opening\", feat[1]], [\"pattern is one network\", pattern_is_connected(user_spec(mode)) ? 1 : 0]];\n\n// ---------- 2D outlines ----------\nmodule sample_2d(w=sample_w, h=sample_h, shape=sample_shape) {\n    if (shape == \"round\") scale([w, h]/2) circle(r=1, $fn=96);\n    else if (shape == \"hexagon\") scale([w/2, h/sqrt(3)]) circle(r=1, $fn=6);\n    else plaque_2d([w, h], shape, r=min(w, h)*0.12);\n}\nfunction sample_size() = [sample_w, sample_h] + (has_edge_wave(sample_shape) ? [0, 20] : [0, 0]);    // room for the wavy edges\n\n// ---------- solids ----------\n// one pattern in one mode on the sample outline\nmodule sample_panel(m, lm0=lining_mode) {\n    lm = pattern_is_connected(user_spec(m)) || lm0 != \"through_cut\" ? lm0 : \"raised\";      // loose patterns cannot be a perforated lining\n    pattern_panel(m, user_spec(m), sample_size(), t=thickness, depth=m == \"overlay\" && lm == \"recessed\" ? min(relief, lining_t/2) : relief,\n                  border=border, pad=m == \"overlay\" ? lining_inset : pad, profile=relief_profile,\n                  lining_t=lining_t, lining_mode=lm, lining_edge=lining_edge) sample_2d();\n}\nmodule gallery_tile(i) {\n    n = NAMES[i]; m = GALLERY_MODES[i];\n    k = tile/56*(n == \"tri_weave\" ? 0.7 : 1);          // patterns grow with the tile (tri-weave: more strands)\n    s = pattern_sized(n, k, opts=n == \"concentric_ripples\" ? [[\"falloff\", 0.6]] : n == \"voronoi\" ? [[\"round\", 0.8*k]] : []);\n    pattern_panel(m, s, [tile, tile], t=m == \"open_lattice\" ? 2.4 : 2, depth=m == \"recessed\" ? 0.8 : 1.2, border=2.5,\n                  profile=n == \"flowing_waves\" ? \"round\" : \"flat\", lining_t=0.8) plaque_2d([tile, tile], \"rounded\", r=4);\n}\n// a wall / floor / roof panel of the box: any pattern, any mode, on a plain rectangle\nmodule box_panel(name, m, size, t, edge) {\n    ok = pattern_is_connected(box_spec(name, t)) || (m != \"through_cut\" && m != \"open_lattice\");\n    pattern_panel(ok ? m : \"raised\", box_spec(name, t), size, t=t, depth=box_relief, border=edge, lining_t=0.6, lining_mode=\"through_cut\")\n        square(size, center=true);\n}\nmodule box_body() {\n    iw = box_w - 2*wall_t; id = box_d - 2*wall_t;\n    // floor: decorated face up (inside the box)\n    box_panel(floor_pattern, floor_mode, [box_w, box_d], floor_t, wall_t + post);\n    // walls: built flat with the decorated face up, then stood up with that face outwards\n    translate([0, -box_d/2, box_h/2]) rotate([90, 0, 0]) translate([0, 0, -wall_t]) box_panel(front, front_m, [box_w, box_h], wall_t, wall_t + 1.5);\n    translate([0, box_d/2, box_h/2]) rotate([90, 0, 180]) translate([0, 0, -wall_t]) box_panel(wall_pattern, wall_mode, [box_w, box_h], wall_t, wall_t + 1.5);\n    for (s=[-1, 1]) translate([s*box_w/2, 0, box_h/2]) rotate([90, 0, s*90]) translate([0, 0, -wall_t]) box_panel(wall_pattern, wall_mode, [box_d, box_h], wall_t, wall_t + 1.5);\n    // corner posts with pins for the lid\n    for (sx=[-1, 1]) for (sy=[-1, 1]) translate([sx*(iw/2 - post/2 + 0.01), sy*(id/2 - post/2 + 0.01), 0]) {\n        translate([-post/2, -post/2, 0]) cube([post, post, box_h]);\n        translate([0, 0, box_h - 0.01]) cylinder(d=pin_d, h=pin_h + 0.01, $fn=24);\n    }\n}\nmodule box_lid() {\n    iw = box_w - 2*wall_t; id = box_d - 2*wall_t;\n    translate([0, 0, box_h]) difference() {\n        box_panel(roof_pattern, roof_mode, [box_w, box_d], roof_t, wall_t + post);\n        for (sx=[-1, 1]) for (sy=[-1, 1]) translate([sx*(iw/2 - post/2 + 0.01), sy*(id/2 - post/2 + 0.01), -1])\n            cylinder(d=pin_d + 2*pin_clr, h=pin_h + 1 + 0.4, $fn=24);\n    }\n}\n\n// ---------- assembly ----------\nif (view == \"gallery\") for (i=[0:len(NAMES)-1]) pick(str(\"g_\", NAMES[i])) translate(tile_pos(i)) gallery_tile(i);\n\nif (view == \"sample\") pick(\"sample\") sample_panel(mode);\n\nif (view == \"modes\") {\n    can_open = pattern_is_connected(user_spec(\"open_lattice\"));\n    // the bare pattern: 2D patterns extruded, woven patterns as strands, in a thin frame\n    pick(\"m_flat\") translate([-2.5*mp, 0, 0]) {\n        pattern_3d(user_spec(\"raised\"), sample_size(), relief, profile=relief_profile) sample_2d();\n        linear_extrude(relief) stroke_2d(1.6, inside=true) sample_2d();\n    }\n    for (i=[0:4]) if (i > 1 || can_open) pick(str(\"m_\", MODES[i])) translate([(i - 1.5)*mp, 0, 0]) sample_panel(MODES[i]);\n}\n\nif (view == \"box\") {\n    pick(\"box\") box_body();\n    pick(\"lid\") box_lid();\n}\n"}, "lib/patterns.scad": {"text": "// Parametric patterns for any flat surface: walls, floors, roofs, lids, panels, inserts.\n// Use:  use <../../lib/patterns.scad>\n//\n// Three layers, so a project only picks a pattern by name and says how to apply it:\n//   1. pattern engine      pattern_2d() / pattern_3d(): the bare pattern (generators in lib/patterns/*.scad)\n//   2. surface application pattern_cutout_2d(), pattern_panel_2d(), pattern_relief(), pattern_cutter(),\n//                          pattern_lining(), and pattern_panel(mode, ...) which builds a whole decorated panel\n//   3. project geometry    the project places the result with ordinary translate() / rotate()\n//\n// Frame (every module here): the pattern lies in the XY plane, centred on the origin, inside the rectangle\n// `size` = [x, y]. The decorated surface is the plane z = 0 with its outside towards +Z:\n//   pattern_3d / pattern_relief   stand on z = 0 and rise to z = h\n//   pattern_cutter                reaches from z = 0 down to z = -depth (subtract it from the host)\n//   pattern_lining                lies on z = 0, t thick\n//   pattern_panel                 is a slab from z = 0 to z = t with the decorated face on top (relief above t)\n// To decorate a vertical wall, a sloped roof or any other flat face, build in this frame and then move it:\n// e.g. rotate([90, 0, 0]) for a wall facing -Y. Nothing in here assumes a horizontal surface.\n//\n// Children: the modules take the surface outline as a 2D child (any shape inside `size`); without a child\n// the outline is the rectangle `size`. pattern_2d / pattern_3d use the child only to clip the pattern.\n//\n// A pattern is described by a name or by a spec (one spec, many uses):\n//   p = pattern_spec(\"hex_honeycomb\", cell=12, strut=1.5, angle=15);\n//   pattern_2d(p, [100, 80]);            pattern_2d(\"voronoi\", [100, 80], cell=10, seed=7);\nuse <patterns/tiling.scad>\nuse <patterns/geometric.scad>\nuse <patterns/woven.scad>\nuse <patterns/organic.scad>\nuse <patterns/decorative.scad>\nuse <patterns/relief.scad>\n\n// ---------- option lists ----------\nPATTERNS = [\"hex_honeycomb\", \"square_grid\", \"diamond_lattice\", \"triangular_lattice\",     // geometric lattices\n            \"cube_rosette\",\n            \"basket_weave\", \"tri_weave\",                                                  // woven (3D)\n            \"voronoi\",                                                                    // organic\n            \"fish_scales\", \"truchet_arcs\", \"girih_star_cross\", \"asanoha\",                 // decorative\n            \"flowing_waves\", \"concentric_ripples\", \"fluted\"];                             // surface relief\nPATTERN_MODES   = [\"solid\", \"through_cut\", \"open_lattice\", \"raised\", \"recessed\", \"overlay\"];   // pattern_panel(mode)\nPATTERN_CUTS    = [\"cells\", \"lines\"];              // what a cut removes: the openings between the pattern, or the pattern itself\nRELIEF_PROFILES = [\"flat\", \"round\"];               // top of raised elements\nLINING_MODES    = [\"through_cut\", \"raised\", \"recessed\"];\nLINING_EDGES    = [\"square\", \"chamfer\"];\n\n// smallest printable rib and opening (mm); change them per spec with pattern_spec(min_strut=, min_opening=)\nPAT_MIN_STRUT   = 0.8;\nPAT_MIN_OPENING = 1.0;\nPAT_EPS = 0.01;                                    // overlap between stacked layers, so they fuse\n\n// ---------- pattern spec ----------\n// [cell, strut] defaults: cell = repeat pitch, strut = rib / strip / line width (see lib/README.md for each pattern)\nfunction pattern_default(name) =\n    name == \"hex_honeycomb\" ? [12, 1.5] : name == \"square_grid\" ? [10, 1.5] :\n    name == \"diamond_lattice\" ? [[12, 18], 1.5] : name == \"triangular_lattice\" ? [14, 1.5] :\n    name == \"basket_weave\" ? [10, 7] : name == \"tri_weave\" ? [24, 3] :\n    name == \"voronoi\" ? [14, 1.5] : name == \"fish_scales\" ? [[12, 12], 0.8] :\n    name == \"truchet_arcs\" ? [12, 1.6] : name == \"girih_star_cross\" ? [24, 1.6] :\n    name == \"flowing_waves\" ? [8, 2.4] : name == \"concentric_ripples\" ? [6, 2] :\n    name == \"cube_rosette\" ? [10, 2] : name == \"asanoha\" ? [18, 1.2] : name == \"fluted\" ? [6, 6] : undef;\nfunction pattern_known(name) = !is_undef(pattern_default(name));\n\n// name      one of PATTERNS\n// cell      repeat pitch, number or [x, y]          strut    rib / strip / line width, number or [a, b]\n// angle     rotation of the pattern (degrees)       offset   [x, y] shift of the pattern (phase), in its own axes\n// density   >1 = more, smaller cells (pitch = cell/density; strut unchanged)\n// seed      for the patterns with random variation  scale    [x, y] stretch of the finished pattern (also stretches ribs)\n// opts      pattern-specific settings as [[\"key\", value], ...] (see pattern_opt_keys())\n// min_strut, min_opening   printability limits checked by every module (0 = no check)\nfunction pattern_spec(name, cell, strut, angle=0, offset=[0, 0], density=1, seed=1, scale=[1, 1], opts=[],\n                      min_strut=PAT_MIN_STRUT, min_opening=PAT_MIN_OPENING) =\n    assert(pattern_known(name), str(\"unknown pattern \\\"\", name, \"\\\"; choose one of \", PATTERNS))\n    assert(density > 0, \"pattern density must be above 0\")\n    [name, is_undef(cell) ? pattern_default(name)[0] : cell, is_undef(strut) ? pattern_default(name)[1] : strut,\n     angle, offset, density, seed, pat_xy(scale), opts, min_strut, min_opening];\n// A spec sized from the pattern's defaults, for projects that let the user leave sizes at 0 (\"automatic\"):\n// k scales the default cell and rib together; cell > 0 sets the cell (two-size cells keep their proportion);\n// strut > 0 sets the rib width, otherwise it is the scaled default but not below strut_min.\nfunction pattern_sized(name, k=1, cell=0, strut=0, angle=0, seed=1, opts=[], strut_min=0,\n                       min_strut=PAT_MIN_STRUT, min_opening=PAT_MIN_OPENING) = let(\n    d = pattern_default(name), d0 = is_list(d[0]) ? d[0][0] : d[0], kc = cell > 0 ? cell/d0 : k)\n    pattern_spec(name, is_list(d[0]) ? [for (x=d[0]) x*kc] : d[0]*kc,\n                 strut > 0 ? strut : name == \"basket_weave\" ? d[1]*k : max(strut_min, d[1]*k),\n                 angle, seed=seed, opts=opts, min_strut=min_strut, min_opening=min_opening);\n// settings each pattern reads from opts (anything else is ignored)\nfunction pattern_opt_keys(name) =\n    name == \"hex_honeycomb\" ? [\"orient\"] : name == \"square_grid\" ? [\"stagger\"] :\n    name == \"triangular_lattice\" ? [\"alternate\", \"orient\"] :\n    name == \"basket_weave\" || name == \"tri_weave\" ? [\"lift\", \"style\"] :\n    name == \"voronoi\" ? [\"irregularity\", \"min_cell\", \"round\"] :\n    name == \"fish_scales\" ? [\"overlap\", \"curvature\", \"stagger\", \"shingle\", \"steps\"] :\n    name == \"truchet_arcs\" ? [\"variation\", \"bias\"] : name == \"girih_star_cross\" ? [\"star\", \"star_ratio\"] :\n    name == \"flowing_waves\" ? [\"amplitude\", \"wavelength\", \"phase\", \"shift\", \"ties\"] :\n    name == \"concentric_ripples\" ? [\"rings\", \"first\", \"centers\", \"spokes\", \"falloff\", \"steps\"] :\n    name == \"cube_rosette\" ? [\"cubes\"] : name == \"asanoha\" ? [\"orient\"] :\n    name == \"fluted\" ? [\"style\", \"orient\", \"steps\", \"tie_pitch\", \"ties\"] : [];\nfunction pat_opt(opts, key, default) = let(r = [for (e=opts) if (e[0] == key) e[1]]) len(r) > 0 ? r[0] : default;\n\n// a name (plus the common settings given as arguments) or a ready spec -> spec\nfunction _ps(p, cell, strut, angle, seed, opts) = is_string(p)\n    ? pattern_spec(p, cell, strut, is_undef(angle) ? 0 : angle, seed=is_undef(seed) ? 1 : seed, opts=is_undef(opts) ? [] : opts) : p;\nfunction _pc(s) = s[1]/s[5];                                   // effective cell\nfunction _po(s, key, default) = pat_opt(s[8], key, default);\n\nfunction pattern_is_3d(p) = let(n = is_string(p) ? p : p[0]) n == \"basket_weave\" || n == \"tri_weave\";\n// true if the pattern's material forms one network that reaches the edge of any outline (so it can stand\n// alone as an open lattice or stay in one piece when its cells are cut through)\nfunction pattern_is_connected(p) = let(s = _ps(p), n = s[0])\n    n == \"truchet_arcs\" ? false : n == \"concentric_ripples\" ? let(sp = _po(s, \"spokes\", undef)) is_undef(sp) || sp > 0 :\n    n == \"fluted\" ? let(t = _po(s, \"ties\", undef)) is_undef(t) || t > 0 : true;\n// Line patterns need ties when they are cut through: without them the lines only hang on the frame (they\n// would print as long bridges and flex). Wherever the cells are cut out, a spec that does not say otherwise gets\n// them: flowing_waves ties = 1 (a bar between neighbouring ribs every wavelength), fluted ties = 1 (every\n// tie_pitch, default 4 ribs), concentric_ripples spokes = 6.\n// Set opts [\"ties\", 0] / [\"spokes\", 0] to switch them off, or a number to choose. Reliefs are left as they are.\nfunction pattern_tied(p) = let(s = _ps(p), add =\n    (s[0] == \"flowing_waves\" || s[0] == \"fluted\") && is_undef(_po(s, \"ties\", undef)) ? [[\"ties\", 1]] :\n    s[0] == \"concentric_ripples\" && is_undef(_po(s, \"spokes\", undef)) ? [[\"spokes\", 6]] : [])\n    len(add) == 0 ? s : [for (i=[0:len(s)-1]) i == 8 ? concat(s[8], add) : s[i]];\n// Wrapping a pattern round a closed wall: it only closes without a seam if it repeats after exactly the length\n// of the wall. pattern_period(p) = the length along X after which a pattern repeats (0 = it does not).\n// pattern_wrapped(p, L) = the same pattern, adjusted as little as possible so that L is a whole number of\n// repeats: the cell size is scaled by a few percent (rib widths stay), flowing waves get a fitting wavelength,\n// and the random patterns (voronoi, truchet_arcs) are made to repeat after L. Rotated or stretched patterns and\n// concentric ripples are returned unchanged (they cannot be made to repeat this way).\nfunction pattern_period(p) = let(s = _ps(p), n = s[0], c = pat_xy(_pc(s))[0])\n    n == \"hex_honeycomb\" ? (_po(s, \"orient\", \"pointy\") == \"flat\" ? c*sqrt(3) : c) :\n    n == \"triangular_lattice\" ? (_po(s, \"orient\", \"up\") == \"side\" ? c*sqrt(3) : c) :\n    n == \"basket_weave\" ? 2*c : n == \"tri_weave\" ? c/sin(60) :\n    n == \"truchet_arcs\" ? 2*c :\n    n == \"flowing_waves\" ? _po(s, \"wavelength\", 30) : n == \"concentric_ripples\" ? 0 :\n    n == \"cube_rosette\" ? 3*sqrt(3)*c :                        // the cube / rosette colouring repeats every third hexagon\n    n == \"asanoha\" ? (_po(s, \"orient\", \"up\") == \"side\" ? c*sqrt(3) : c) :\n    n == \"fluted\" ? (_po(s, \"orient\", \"vertical\") == \"vertical\" ? c : 0) : c;\nfunction pattern_wrapped(p, L) = let(s = _ps(p), per = pattern_period(s))\n    s[3] != 0 || s[7] != [1, 1] || per <= 0 ? s : let(\n        n = max(1, round(L/per)), k = L/(n*per),\n        add = s[0] == \"flowing_waves\" ? [[\"wavelength\", L/n]] :\n              s[0] == \"voronoi\" ? [[\"wrap\", n]] : s[0] == \"truchet_arcs\" ? [[\"wrap\", 2*n]] : [],\n        cell = s[0] == \"flowing_waves\" ? s[1] : is_list(s[1]) ? [for (x=s[1]) x*k] : s[1]*k,\n        strut = s[0] == \"fluted\" && pat_xy(s[2])[0] >= pat_xy(s[1])[0] - 0.001 ? s[2]*k : s[2])   // touching ribs stay touching\n        [for (i=[0:len(s)-1]) i == 1 ? cell : i == 2 ? strut : i == 8 ? concat(add, s[8]) : s[i]];\n// the same pattern moved by d = [x, y] on the surface (the anchor of the pattern goes to d)\nfunction pattern_shift(p, d) = let(s = _ps(p), q = pat_rot(d, -s[3])) [for (i=[0:len(s)-1]) i == 4 ? s[4] + q : s[i]];\n\n// ---------- printability ----------\n// [smallest rib width, smallest opening] of a spec\nfunction pattern_features(p) = let(s = _ps(p), n = s[0], c = pat_xy(_pc(s)), st = pat_xy(s[2]))\n    n == \"hex_honeycomb\" ? [st[0], c[0] - st[0]] :\n    n == \"square_grid\" ? [min(st), min(c[0] - st[0], c[1] - st[1])] :\n    n == \"diamond_lattice\" ? [st[0], 2*(c[0]*c[1]/4/norm(c/2) - st[0]/2)] :\n    n == \"triangular_lattice\" ? [st[0], 2*(c[0]/(2*sqrt(3)) - st[0]/2)] :\n    n == \"basket_weave\" ? [st[0], c[0] - st[0]] :\n    n == \"tri_weave\" ? [st[0], tri_weave_opening(c[0], st[0])] :\n    n == \"voronoi\" ? [st[0], c[0]/2 - st[0]] :\n    n == \"fish_scales\" ? [st[0], min(c[0], fish_row_pitch(c, _po(s, \"overlap\", 0.4))) - st[0]] :\n    n == \"truchet_arcs\" ? [st[0], c[0]/2 - st[0]] :\n    n == \"girih_star_cross\" ? [st[0], 0.29*_po(s, \"star\", c[0]) - st[0]] :\n    n == \"flowing_waves\" ? [st[0], wave_gap(c[0], st[0], _po(s, \"amplitude\", 3), _po(s, \"wavelength\", 30), _po(s, \"shift\", 0))] :\n    n == \"cube_rosette\" ? [st[0], _po(s, \"cubes\", \"sparse\") == \"all\" ? 2*(c[0]*sin(60)/2 - st[0]/2) : 2*(c[0]/(2*sqrt(3)) - st[0]/2)] :\n    n == \"asanoha\" ? [st[0], asanoha_opening(c[0], st[0])] :\n    n == \"fluted\" ? [min(st[0], c[0]), c[0] - st[0]] :\n    [st[0], c[0] - st[0]];\n// \"\" if the spec is printable, otherwise what is wrong (use in an assert, or show it to the user)\nfunction pattern_problem(p) = let(s = _ps(p), f = pattern_features(s), closed = (s[0] == \"basket_weave\" && f[1] < 0.001) || (s[0] == \"fluted\" && f[1] < s[10]))   // closed weave / touching ribs: fine\n    s[9] > 0 && f[0] < s[9] - 0.001 ? str(s[0], \": rib/strip width \", f[0], \" is below min_strut \", s[9]) :\n    f[1] < -0.001 && !closed ? str(s[0], \": strut \", s[2], \" does not fit into cell \", _pc(s), \" (elements overlap)\") :\n    s[10] > 0 && !closed && f[1] < s[10] - 0.001 ? str(s[0], \": openings are about \", f[1], \" wide, below min_opening \", s[10],\n        \" (larger cell, thinner strut, or lower density)\") : \"\";\n\n// ---------- layer 1: pattern engine ----------\n// the bare 2D pattern (material), generated to cover `cover` around the origin, in the pattern's own axes\nmodule _pat_gen_2d(s, cover, g=[0, 0]) {\n    n = s[0]; c = _pc(s); st = s[2];\n    if (n == \"hex_honeycomb\") hex_honeycomb_2d(cover, pat_xy(c)[0], pat_xy(st)[0], _po(s, \"orient\", \"pointy\"), center=g);\n    else if (n == \"square_grid\") square_grid_2d(cover, c, st, _po(s, \"stagger\", 0), center=g);\n    else if (n == \"diamond_lattice\") diamond_lattice_2d(cover, c, pat_xy(st)[0], center=g);\n    else if (n == \"triangular_lattice\") triangular_lattice_2d(cover, pat_xy(c)[0], pat_xy(st)[0], _po(s, \"alternate\", true), _po(s, \"orient\", \"up\"), center=g);\n    else if (n == \"basket_weave\") basket_weave_2d(cover, pat_xy(c)[0], pat_xy(st)[0], center=g);\n    else if (n == \"tri_weave\") tri_weave_2d(cover, pat_xy(c)[0], pat_xy(st)[0], center=g);\n    else if (n == \"voronoi\") voronoi_2d(cover, pat_xy(c)[0], pat_xy(st)[0], s[6], _po(s, \"irregularity\", 1), _po(s, \"min_cell\", 0), _po(s, \"round\", 0), center=g, wrap=_po(s, \"wrap\", 0));\n    else if
