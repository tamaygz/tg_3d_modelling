# Build a web configurator for every project, publish them on GitHub Pages and create a release that links them.
#
# Run it by hand: Actions → "Web configurators and release" → Run workflow.
# One-time setup: Settings → Pages → Build and deployment → Source = "GitHub Actions".
#
# Each page is generated by yawkat/web-openscad-editor: it runs OpenSCAD (WebAssembly) in the browser and
# bundles the model, every lib/ file it includes and the bundled fonts, so nothing is fetched from this repo.
name: Web configurators and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = configurators-YYYY-MM-DD-<short sha>)"
        required: false
        default: ""
      projects:
        description: "Comma-separated project names (empty = all)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write     # create the release
  pages: write        # deploy to GitHub Pages
  id-token: write     # required by actions/deploy-pages

concurrency:
  group: configurators
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD (reads each project's parts table)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openscad

      - name: Stage models, library and editor.toml
        run: |
          python3 tools/make_pages.py --out build/pages-src \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --ref "${{ github.sha }}" --only "${{ inputs.projects }}"

      - name: Generate the configurator site
        # pinned to a commit of v2 (same generator the pages were tested with)
        uses: yawkat/web-openscad-editor@323ca329f12ea210428ed6407f57f870fba548b7
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"     # runners may lack FUSE for the OpenSCAD AppImage
        with:
          config: build/pages-src/editor.toml
          output: build/site
          clean-urls: "true"

      - name: Check every project page exists
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          site = pathlib.Path("build/site")
          missing = [p["page"] for p in json.load(open("build/pages-src/projects.json"))
                     if not (site / f"{p['page']}.html").exists()]
          if missing:
              sys.exit(f"missing pages: {missing}")
          print("all pages generated:", sorted(f.name for f in site.glob("*.html")))
          PY
          touch build/site/.nojekyll

      - name: Zip the site (offline copy for the release)
        run: cd build/site && zip -q -r ../configurators-site.zip .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/pages-src/projects.json
            build/configurators-site.zip

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG_INPUT: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-configurators-$(date -u +%Y-%m-%d)-${SHA::7}}"
          python3 tools/release_notes.py release/projects.json \
            --pages "$PAGE_URL" --repo-url "$REPO_URL" --ref "$SHA" > release/notes.md
          cat release/notes.md
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$tag" --target "$SHA" --title "Web configurators $tag" \
            --notes-file release/notes.md "${flags[@]}" release/configurators-site.zip
